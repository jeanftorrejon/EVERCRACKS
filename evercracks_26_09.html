<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evercracks | Dashboard 26/09 | Jean Franco Torrejon</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f0f6;color:#2a1a3e;font-size:14px}
.header{background:linear-gradient(180deg,#2a1a3e 0%,#4a2d72 100%);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(42,26,62,.45)}
.header-top{display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:17px;font-weight:700;letter-spacing:.3px}
.header .meta{font-size:11px;opacity:.85;margin-top:2px}
.badge{background:rgba(255,255,255,.2);padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:2px solid #e4dbec;position:sticky;top:57px;z-index:99;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 14px;white-space:nowrap;cursor:pointer;font-size:13px;font-weight:500;color:#666;border-bottom:3px solid transparent;margin-bottom:-2px;flex-shrink:0;transition:color .2s}
.tab.active{color:#5b3a8c;border-bottom-color:#5b3a8c;font-weight:700}
.panel{display:none;padding:14px}
.panel.active{display:block}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi-card{background:#fff;border-radius:10px;padding:11px 10px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center;border-top:3px solid #e4dbec}
.kpi-card.green{border-top-color:#16a34a}.kpi-card.amber{border-top-color:#d97706}.kpi-card.red{border-top-color:#dc2626}
.kpi-label{font-size:10px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi-value{font-size:18px;font-weight:800;margin-top:3px;line-height:1}
.kpi-sub{font-size:10px;color:#999;margin-top:2px}
.section-title{font-size:12px;font-weight:700;color:#444;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.section-title::after{content:'';flex:1;height:1px;background:#e4dbec}
.canal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.canal-card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.canal-label{font-size:11px;font-weight:700;color:#fff;padding:2px 8px;border-radius:12px;display:inline-block;margin-bottom:8px}
.canal-whs{background:#c2561a}.canal-smk{background:#1f5f6b}
.canal-net{font-size:20px;font-weight:800}
.canal-tgt{font-size:11px;color:#888;margin-top:1px}
.progress-bar{height:6px;background:#ece5f2;border-radius:3px;margin:6px 0;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .4s}
.fill-green{background:#16a34a}.fill-amber{background:#d97706}.fill-red{background:#dc2626}
.canal-stats{display:flex;gap:10px;font-size:11px;color:#666;margin-top:4px;flex-wrap:wrap}
.stat-val{font-weight:700}
.ruta-list{display:flex;flex-direction:column;gap:6px}
.ruta-bar-item{background:#fff;border-radius:8px;padding:9px 10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ruta-bar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.ruta-name{font-size:12px;font-weight:700}
.ruta-pct{font-size:13px;font-weight:800}
.ruta-bar-meta{font-size:10px;color:#888}
.analysis-box{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:8px}
.analysis-box h3{font-size:12px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.analysis-box p{font-size:12px;color:#555;line-height:1.6}
.tag{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;margin-right:4px}
.tag-green{background:#dcfce7;color:#15803d}.tag-amber{background:#fef3c7;color:#92400e}.tag-red{background:#fee2e2;color:#991b1b}
.subcad-list{display:flex;flex-direction:column;gap:6px}
.subcad-item{background:#fff;border-radius:8px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.subcad-top{display:flex;justify-content:space-between;align-items:center}
.subcad-name{font-size:13px;font-weight:700}
.subcad-meta{display:flex;gap:10px;font-size:11px;color:#888;flex-wrap:wrap;margin-top:4px}
.semaforo{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}
.sem-green{background:#16a34a}.sem-amber{background:#d97706}.sem-red{background:#dc2626}
.ruta-card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:8px;overflow:hidden}
.ruta-card-header{padding:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
.ruta-card-header:active{background:#f7f4f9}
.ruta-card-arrow{font-size:12px;color:#999;transition:transform .2s}
.ruta-card-arrow.open{transform:rotate(180deg)}
.ruta-card-body{display:none;border-top:1px solid #ece5f2}
.ruta-card-body.open{display:block}
.sala-row{padding:8px 12px;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #f7f4f9;font-size:12px}
.sala-row:last-child{border-bottom:none}
.sala-name{font-weight:600;flex:1}
.sala-stats{display:flex;gap:8px;font-size:11px;flex-shrink:0}
.ddv-block{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:12px}
.ddv-title{font-size:12px;font-weight:700;color:#444;margin-bottom:10px}
.ddv-nums{display:flex;margin-bottom:8px}
.ddv-num{text-align:center;flex:1}
.ddv-num-val{font-size:24px;font-weight:800;line-height:1}
.ddv-num-lbl{font-size:10px;color:#888;margin-top:2px}
.ddv-progress{height:10px;background:#ece5f2;border-radius:5px;overflow:hidden}
.ddv-fill{height:100%;border-radius:5px;background:#5b3a8c}
.ot-filters{display:flex;gap:6px;margin-bottom:10px}
.ot-filter{padding:5px 12px;border-radius:20px;border:1px solid #ddd;background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:#666}
.ot-filter.active{background:#5b3a8c;color:#fff;border-color:#5b3a8c}
.ot-table{width:100%;border-collapse:collapse;font-size:12px}
.ot-table th{background:#f4f0f6;padding:7px 8px;text-align:left;font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.3px}
.ot-table td{padding:7px 8px;border-bottom:1px solid #ece5f2;vertical-align:middle}
.ot-table tr:hover td{background:#f6f2f9}
.ot-ruta-row td{background:#fbeee0!important;font-weight:700;font-size:12px}
.ot-total-row td{background:#2a1a3e!important;color:#fff!important;font-weight:800;font-size:12px}
.ot-total-row td span{color:#fff!important}
.canal-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.dot-whs{background:#c2561a}.dot-smk{background:#1f5f6b}
.alert-list{display:flex;flex-direction:column;gap:8px}
.alert-item{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid #e4dbec;display:flex;gap:10px;align-items:flex-start}
.alert-item.success{border-left-color:#16a34a}.alert-item.warning{border-left-color:#d97706}
.alert-item.danger{border-left-color:#dc2626}.alert-item.info{border-left-color:#5b3a8c}
.alert-icon{font-size:18px;line-height:1;flex-shrink:0}
.alert-text h4{font-size:13px;font-weight:700;margin-bottom:3px}
.alert-text p{font-size:12px;color:#666;line-height:1.4}
.green-txt{color:#16a34a}.amber-txt{color:#d97706}.red-txt{color:#dc2626}
.purple-txt{color:#c2561a}.orange-txt{color:#1f5f6b}
.mt12{margin-top:12px}
.pill{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.pill-green{background:#dcfce7;color:#15803d}.pill-amber{background:#fef3c7;color:#92400e}.pill-red{background:#fee2e2;color:#991b1b}
.table-scroll{overflow-x:auto}
.inicio-badge{background:#dbeafe;color:#1d4ed8;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;margin-bottom:12px;border-left:4px solid #2563eb}
/* BENCHMARK */
.bench-card{background:#2a1a3e;border-radius:12px;padding:14px;margin-bottom:10px;color:#fff}
.bench-title{font-size:11px;font-weight:700;letter-spacing:.4px;color:#aab;margin-bottom:10px;text-transform:uppercase}
.bench-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.bench-row:last-child{border-bottom:none}
.bench-row.highlight{background:rgba(22,163,74,.18);margin:0 -8px;padding:7px 8px;border-radius:8px}
.bench-name{font-size:12px;font-weight:600}
.bench-vals{text-align:right}
.bench-pct{font-size:14px;font-weight:800}
.bench-sub{font-size:10px;color:#9aa;margin-top:1px}
.rank-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.rank-row:last-child{border-bottom:none}
.rank-row.highlight{background:rgba(22,163,74,.18);margin:0 -8px;padding:8px 8px;border-radius:8px}
.rank-pos{font-size:13px;font-weight:800;color:#889;width:22px}
.rank-name{font-size:12px;font-weight:700;flex:1}
.rank-sub{font-size:10px;color:#9aa}
.rank-pct{font-size:14px;font-weight:800;text-align:right}
/* EXHIBICIONES */
.exhib-total-card{background:#2a1a3e;color:#fff;border-radius:12px;padding:16px;margin-bottom:12px;text-align:center}
.exhib-total-pct{font-size:32px;font-weight:800}
.exhib-total-sub{font-size:11px;color:#aab;margin-top:4px}
.exhib-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.exhib-cadena-card{background:#fff;border-radius:10px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);text-align:center}
.exhib-cadena-pct{font-size:18px;font-weight:800}
.exhib-cadena-name{font-size:11px;font-weight:700;margin-top:2px}
.exhib-cadena-sub{font-size:10px;color:#888;margin-top:1px}
.exhib-badge{padding:1px 6px;border-radius:8px;font-size:9px;font-weight:700;display:inline-block;margin-top:3px}
.exhib-detail-item{padding:8px 12px;border-bottom:1px solid #f7f4f9;font-size:11px}
.exhib-detail-item:last-child{border-bottom:none}
.exhib-detail-top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:2px}
.exhib-detail-meta{color:#888;font-size:10px}
/* VP */
.vp-nivel-badge{padding:2px 7px;border-radius:8px;font-size:9px;font-weight:800}
.vp-nivel-CRITICO{background:#fee2e2;color:#991b1b}
.vp-nivel-ALTO{background:#ffedd5;color:#c2410c}
.vp-nivel-MEDIO{background:#fef3c7;color:#92400e}
.vp-nivel-NORMAL{background:#dcfce7;color:#15803d}
.vp-acc-pill{padding:1px 6px;border-radius:6px;font-size:9px;font-weight:700;background:#ece5f2;color:#555}
.vp-acc-pill.q{background:#fee2e2;color:#991b1b}
.vp-acc-pill.r{background:#fef3c7;color:#92400e}
.vp-acc-pill.v{background:#dbeafe;color:#1d4ed8}
.vp-sku-table{width:100%;font-size:11px;border-collapse:collapse;margin-top:6px}
.vp-sku-table td{padding:5px 4px;border-bottom:1px solid #f1ecf5}
.vp-isv-table{width:100%;font-size:11px;border-collapse:collapse}
.vp-isv-table th{background:#f4f0f6;padding:6px;text-align:left;font-size:9px;color:#888;text-transform:uppercase}
.vp-isv-table td{padding:6px;border-bottom:1px solid #f1ecf5}
.vp-prior-item{display:flex;gap:8px;padding:8px;background:#fff;border-radius:8px;margin-bottom:6px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.vp-prior-n{background:#5b3a8c;color:#fff;font-weight:800;font-size:11px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* INVNEG */
.invneg-table{width:100%;font-size:11px;border-collapse:collapse}
.invneg-table th{background:#f4f0f6;padding:6px;text-align:left;font-size:9px;color:#888;text-transform:uppercase}
.invneg-table td{padding:6px;border-bottom:1px solid #f1ecf5}
/* RESUMEN RUTA */
.recon-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.recon-card{background:#2a1a3e;border-radius:12px;padding:12px;color:#fff}
.recon-card-label{font-size:9px;font-weight:700;letter-spacing:.4px;color:#9aa;text-transform:uppercase;margin-bottom:6px}
.recon-item{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.recon-item:last-child{border-bottom:none}
.recon-item-title{font-size:9px;color:#9aa;text-transform:uppercase;letter-spacing:.3px}
.recon-item-val{font-size:15px;font-weight:800;margin-top:2px}
.recon-item-sub{font-size:10px;color:#aab;margin-top:1px}
.rr-card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:8px;overflow:hidden;border-left:4px solid #e4dbec}
.rr-card.estado-SOBRE{border-left-color:#16a34a}.rr-card.estado-CIEN{border-left-color:#eab308}
.rr-card.estado-AMBAR{border-left-color:#d97706}.rr-card.estado-ATRASADA{border-left-color:#dc2626}
.rr-header{padding:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.rr-badge{font-size:9px;font-weight:800;padding:2px 7px;border-radius:8px;display:inline-block;margin-top:3px}
.rr-badge-SOBRE{background:#dcfce7;color:#15803d}.rr-badge-CIEN{background:#fef9c3;color:#854d0e}
.rr-badge-AMBAR{background:#fef3c7;color:#92400e}.rr-badge-ATRASADA{background:#fee2e2;color:#991b1b}
.rr-body{display:none;border-top:1px solid #ece5f2;padding:10px 12px}
.rr-body.open{display:block}
.rr-row{display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-bottom:1px solid #f7f4f9}
.rr-row:last-child{border-bottom:none}
.rr-row-label{color:#888}
.rr-sala-item{padding:7px 0;border-bottom:1px solid #f1ecf5;font-size:11px}
.rr-sala-item:last-child{border-bottom:none}
.rr-sala-top{display:flex;justify-content:space-between;font-weight:700}
.rr-ac-empty{font-size:11px;color:#999;background:#f6f2f9;border-radius:8px;padding:10px;margin-top:8px}

.dnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;background:rgba(255,255,255,.12);border-radius:10px;padding:6px 8px}
.dnav button{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:15px;font-weight:700;width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.dnav button:disabled{opacity:.3;cursor:default}
.dnav button:not(:disabled):hover{background:rgba(255,255,255,.3)}
.dnav-label{font-size:12px;font-weight:600;letter-spacing:.2px}

.hdr-logo{width:32px;height:32px;border-radius:9px;vertical-align:-8px;margin-right:9px;box-shadow:0 0 0 2px rgba(240,127,30,.7)}
.cobweb{display:flex;justify-content:space-between;align-items:flex-start;height:46px;background:#f4f0f6;overflow:hidden;position:relative;pointer-events:none}
.cobweb svg{display:block;flex-shrink:0}
.cobweb-mid{flex:1;position:relative}
.cobweb-mid .spider{position:absolute;left:68%;top:0;transform-origin:13px 0;animation:spider-drop 1.6s ease-out 1 both}
@keyframes spider-drop{0%{transform:translateY(-30px)}70%{transform:translateY(3px)}100%{transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.cobweb-mid .spider{animation:none}}
.bunting{width:100%;height:22px;display:block;background:#f4f0f6}

/* ===== PORTADA + MI RUTA (prototipo v2) ===== */
.tab.main{font-weight:700;color:#2a1a3e}
.tab-sep{display:flex;align-items:center;padding:0 6px 0 10px;font-size:10px;color:#a898bb;flex-shrink:0;border-left:1px solid #e4dbec;margin:8px 0}
.tab.det{font-size:12px;color:#8a8a8a;padding:11px 10px}
.pt-hero{background:#2a1a3e;color:#fff;border-radius:14px;padding:16px 16px 14px;margin-bottom:12px}
.pt-hero-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pt-big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-1px}
.pt-big small{font-size:15px;font-weight:600;opacity:.75;letter-spacing:0;margin-left:4px}
.pt-state{font-size:12px;font-weight:700;padding:4px 10px;border-radius:14px;white-space:nowrap}
.pt-state.ok{background:#16a34a}.pt-state.amb{background:#d97706}.pt-state.bad{background:#dc2626}
.pt-track{position:relative;height:12px;background:rgba(255,255,255,.14);border-radius:6px;margin:16px 0 6px}
.pt-track-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:#fff}
.pt-track-mark{position:absolute;top:-6px;bottom:-6px;width:3px;background:#f07f1e;border-radius:2px}
.pt-track-legend{display:flex;justify-content:space-between;font-size:11px;opacity:.8}
.pt-track-legend b{color:#f07f1e;font-weight:700}
.pt-need{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.15);display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pt-need div{font-size:11px;opacity:.8;line-height:1.3}
.pt-need b{display:block;font-size:17px;opacity:1;color:#fff;margin-top:2px}
.pt-strip{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pt-mini{background:#fff;border-radius:10px;padding:10px 12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.pt-mini-l{font-size:11px;color:#888}
.pt-mini-v{font-size:19px;font-weight:800;margin-top:2px}
.pt-mini-s{font-size:11px;color:#999;margin-top:1px}
.pt-h{font-size:14px;font-weight:800;color:#2a1a3e;margin:16px 0 8px}
.pt-act{background:#fff;border-radius:10px;padding:11px 12px;margin-bottom:6px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:4px solid #dc2626;font-size:13px;line-height:1.4}
.pt-act.amb{border-left-color:#d97706}.pt-act.blue{border-left-color:#5b3a8c}
.pt-act b{color:#2a1a3e}
.pt-act span{display:block;font-size:11px;color:#888;margin-top:2px}
.pt-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pt-list{background:#fff;border-radius:10px;padding:4px 12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.pt-list-t{font-size:11px;font-weight:700;padding:8px 0 4px}
.pt-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid #eee8f3;font-size:12px;cursor:pointer}
.pt-row small{display:block;font-size:10px;color:#999}
.pt-recon{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pt-recon div{background:#fff;border-radius:10px;padding:10px 12px;box-shadow:0 1px 4px rgba(0,0,0,.06);border-top:3px solid #f07f1e;font-size:11px;color:#888;cursor:pointer}
.pt-recon b{display:block;font-size:17px;color:#2a1a3e;margin-top:3px}
.pt-recon span{font-size:12px;font-weight:700;color:#16a34a}
.pt-link{display:block;text-align:center;margin:16px 0 4px;font-size:12px;color:#5b3a8c;font-weight:600;cursor:pointer}
@media(max-width:380px){.pt-cols{grid-template-columns:1fr}.pt-big{font-size:38px}}

.mr-pick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:10px}
.mr-pick::-webkit-scrollbar{display:none}
.mr-chip{flex-shrink:0;border:1.5px solid #d9cde6;background:#fff;color:#2a1a3e;font-size:12px;font-weight:700;padding:7px 11px;border-radius:18px;cursor:pointer}
.mr-chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.mr-chip.on{background:#2a1a3e;color:#fff;border-color:#2a1a3e}
.mr-chip:focus-visible,.pt-row:focus-visible,.mr-share:focus-visible{outline:2px solid #f07f1e;outline-offset:2px}

<script>
(function(){
  var KEY='ev_k', V=JSON.parse(document.getElementById('ev-vault').textContent);
  var $=function(i){return document.getElementById(i)};
  var enc=new TextEncoder(), dc=new TextDecoder();
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function u2b(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
  function hex(u){return Array.prototype.map.call(u,function(x){return ('0'+x.toString(16)).slice(-2)}).join('')}
  var S=window.crypto&&window.crypto.subtle;
  async function derive(g){var km=await S.importKey('raw',enc.encode(g),'PBKDF2',false,['deriveBits']);
    return new Uint8Array(await S.deriveBits({name:'PBKDF2',salt:b64(V.salt),iterations:V.iter,hash:'SHA-256'},km,256))}
  async function kid(K){return hex(new Uint8Array(await S.digest('SHA-256',K))).slice(0,16)}
  async function dec(K,o){var k=await S.importKey('raw',K,'AES-GCM',false,['decrypt']);
    return JSON.parse(dc.decode(await S.decrypt({name:'AES-GCM',iv:b64(o.iv)},k,b64(o.ct))))}
  function boot(p,sh){
    window.EV_SESSION={mode:p.mode,ruta:p.ruta,nombre:p.nombre};
    if(p.ruta){try{localStorage.setItem('evercracks_mi_ruta',p.ruta)}catch(e){}}
    var tmp=document.createElement('div');tmp.innerHTML=sh.body;
    var scripts=[].slice.call(tmp.querySelectorAll('script')).map(function(s){var o={type:s.getAttribute('type'),text:s.textContent};s.parentNode.removeChild(s);return o});
    document.body.classList.remove('ev-lock');
    document.body.innerHTML='';
    while(tmp.firstChild)document.body.appendChild(tmp.firstChild);
    scripts.forEach(function(s){var n=document.createElement('script');if(s.type)n.setAttribute('type',s.type);n.textContent=s.text;document.body.appendChild(n)});
    if(p.ruta){try{irTab('miruta')}catch(e){}}
    var o=document.createElement('div');o.id='ev-out';o.textContent='Salir';
    o.onclick=function(){try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
    document.body.appendChild(o);
  }
  async function open(K){
    var id=await kid(K),u=V.users.filter(function(x){return x.kid===id})[0];
    if(!u)return false;
    try{var p=await dec(K,u),sh=await dec(b64(p.sk),V.shared);boot(p,sh);return true}catch(e){return false}
  }
  async function go(){
    var g=$('ev-gpid').value.replace(/\s+/g,'');
    if(!g){$('ev-err').textContent='Escribe tu GPID.';return}
    var rem=$('ev-rem').checked;
    $('ev-go').disabled=true;$('ev-err').textContent='';$('ev-go').textContent='Abriendo…';
    try{
      var K=await derive(g);
      if(await open(K)){
        if(rem){try{localStorage.setItem(KEY,u2b(K))}catch(e){}}
        return;
      }
      $('ev-err').textContent='No reconozco ese GPID. Revísalo e intenta de nuevo.';
    }catch(e){if($('ev-err'))$('ev-err').textContent='No pude abrir el acceso en este navegador. Prueba con Chrome o Safari actualizado.'}
    if($('ev-go')){$('ev-go').disabled=false;$('ev-go').textContent='Entrar'}
  }
  document.body.classList.add('ev-lock');
  if(!S){$('ev-err').textContent='Abre este link con https en Chrome o Safari.';$('ev-go').disabled=true;return}
  $('ev-go').onclick=go;
  $('ev-gpid').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
  var saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  if(saved){$('ev-sub').textContent='Abriendo…';
    open(b64(saved)).then(function(ok){if(!ok){try{localStorage.removeItem(KEY)}catch(e){}$('ev-sub').textContent='Ingresa tu GPID para entrar'}})
      .catch(function(){$('ev-sub').textContent='Ingresa tu GPID para entrar'})}
})();
