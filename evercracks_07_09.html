<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evercracks | Dashboard 07/09 | Jean Franco Torrejon</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#faf5ec;color:#17335e;font-size:14px}
.header{background:#2b5ea8;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(43,94,168,.35)}
.header-top{display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:17px;font-weight:700;letter-spacing:.3px}
.header .meta{font-size:11px;opacity:.85;margin-top:2px}
.badge{background:rgba(255,255,255,.2);padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:2px solid #eee1cb;position:sticky;top:57px;z-index:99;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 14px;white-space:nowrap;cursor:pointer;font-size:13px;font-weight:500;color:#666;border-bottom:3px solid transparent;margin-bottom:-2px;flex-shrink:0;transition:color .2s}
.tab.active{color:#2b5ea8;border-bottom-color:#2b5ea8;font-weight:700}
.panel{display:none;padding:14px}
.panel.active{display:block}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi-card{background:#fff;border-radius:10px;padding:11px 10px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center;border-top:3px solid #eee1cb}
.kpi-card.green{border-top-color:#16a34a}.kpi-card.amber{border-top-color:#d97706}.kpi-card.red{border-top-color:#dc2626}
.kpi-label{font-size:10px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi-value{font-size:18px;font-weight:800;margin-top:3px;line-height:1}
.kpi-sub{font-size:10px;color:#999;margin-top:2px}
.section-title{font-size:12px;font-weight:700;color:#444;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.section-title::after{content:'';flex:1;height:1px;background:#eee1cb}
.canal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.canal-card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.canal-label{font-size:11px;font-weight:700;color:#fff;padding:2px 8px;border-radius:12px;display:inline-block;margin-bottom:8px}
.canal-whs{background:#8a4a2e}.canal-smk{background:#1f5f6b}
.canal-net{font-size:20px;font-weight:800}
.canal-tgt{font-size:11px;color:#888;margin-top:1px}
.progress-bar{height:6px;background:#f2e9da;border-radius:3px;margin:6px 0;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .4s}
.fill-green{background:#16a34a}.fill-amber{background:#d97706}.fill-red{background:#dc2626}
.canal-stats{display:flex;gap:10px;font-size:11px;color:#666;margin-top:4px;flex-wrap:wrap}
.stat-val{font-weight:700}
.ruta-list{display:flex;flex-direction:column;gap:6px}
.ruta-bar-item{background:#fff;border-radius:8px;padding:9px 10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ruta-bar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.ruta-name{font-size:12px;font-weight:700}
.ruta-pct{font-size:13px;font-weight:800}
.ruta-bar-meta{font-size:10px;color:#888}
.analysis-box{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:8px}
.analysis-box h3{font-size:12px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.analysis-box p{font-size:12px;color:#555;line-height:1.6}
.tag{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;margin-right:4px}
.tag-green{background:#dcfce7;color:#15803d}.tag-amber{background:#fef3c7;color:#92400e}.tag-red{background:#fee2e2;color:#991b1b}
.subcad-list{display:flex;flex-direction:column;gap:6px}
.subcad-item{background:#fff;border-radius:8px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.subcad-top{display:flex;justify-content:space-between;align-items:center}
.subcad-name{font-size:13px;font-weight:700}
.subcad-meta{display:flex;gap:10px;font-size:11px;color:#888;flex-wrap:wrap;margin-top:4px}
.semaforo{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}
.sem-green{background:#16a34a}.sem-amber{background:#d97706}.sem-red{background:#dc2626}
.ruta-card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:8px;overflow:hidden}
.ruta-card-header{padding:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
.ruta-card-header:active{background:#faf6ee}
.ruta-card-arrow{font-size:12px;color:#999;transition:transform .2s}
.ruta-card-arrow.open{transform:rotate(180deg)}
.ruta-card-body{display:none;border-top:1px solid #f2e9da}
.ruta-card-body.open{display:block}
.sala-row{padding:8px 12px;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #faf6ee;font-size:12px}
.sala-row:last-child{border-bottom:none}
.sala-name{font-weight:600;flex:1}
.sala-stats{display:flex;gap:8px;font-size:11px;flex-shrink:0}
.ddv-block{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:12px}
.ddv-title{font-size:12px;font-weight:700;color:#444;margin-bottom:10px}
.ddv-nums{display:flex;margin-bottom:8px}
.ddv-num{text-align:center;flex:1}
.ddv-num-val{font-size:24px;font-weight:800;line-height:1}
.ddv-num-lbl{font-size:10px;color:#888;margin-top:2px}
.ddv-progress{height:10px;background:#f2e9da;border-radius:5px;overflow:hidden}
.ddv-fill{height:100%;border-radius:5px;background:#2b5ea8}
.ot-filters{display:flex;gap:6px;margin-bottom:10px}
.ot-filter{padding:5px 12px;border-radius:20px;border:1px solid #ddd;background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:#666}
.ot-filter.active{background:#2b5ea8;color:#fff;border-color:#2b5ea8}
.ot-table{width:100%;border-collapse:collapse;font-size:12px}
.ot-table th{background:#faf5ec;padding:7px 8px;text-align:left;font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.3px}
.ot-table td{padding:7px 8px;border-bottom:1px solid #f2e9da;vertical-align:middle}
.ot-table tr:hover td{background:#fbf7ef}
.ot-ruta-row td{background:#fbeee0!important;font-weight:700;font-size:12px}
.ot-total-row td{background:#17335e!important;color:#fff!important;font-weight:800;font-size:12px}
.ot-total-row td span{color:#fff!important}
.canal-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.dot-whs{background:#8a4a2e}.dot-smk{background:#1f5f6b}
.alert-list{display:flex;flex-direction:column;gap:8px}
.alert-item{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid #eee1cb;display:flex;gap:10px;align-items:flex-start}
.alert-item.success{border-left-color:#16a34a}.alert-item.warning{border-left-color:#d97706}
.alert-item.danger{border-left-color:#dc2626}.alert-item.info{border-left-color:#2b5ea8}
.alert-icon{font-size:18px;line-height:1;flex-shrink:0}
.alert-text h4{font-size:13px;font-weight:700;margin-bottom:3px}
.alert-text p{font-size:12px;color:#666;line-height:1.4}
.green-txt{color:#16a34a}.amber-txt{color:#d97706}.red-txt{color:#dc2626}
.purple-txt{color:#8a4a2e}.orange-txt{color:#1f5f6b}
.mt12{margin-top:12px}
.pill{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.pill-green{background:#dcfce7;color:#15803d}.pill-amber{background:#fef3c7;color:#92400e}.pill-red{background:#fee2e2;color:#991b1b}
.table-scroll{overflow-x:auto}
.inicio-badge{background:#dbeafe;color:#1d4ed8;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;margin-bottom:12px;border-left:4px solid #2563eb}
/* BENCHMARK */
.bench-card{background:#17335e;border-radius:12px;padding:14px;margin-bottom:10px;color:#fff}
.bench-title{font-size:11px;font-weight:700;letter-spacing:.4px;color:#aab;margin-bottom:10px;text-transform:uppercase}
.bench-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.bench-row:last-child{border-bottom:none}
.bench-row.highlight{background:rgba(22,163,74,.18);margin:0 -8px;padding:7px 8px;border-radius:8px}
.bench-name{font-size:12px;font-weight:600}
.bench-vals{text-align:right}
.bench-pct{font-size:14px;font-weight:800}
.bench-sub{font-size:10px;color:#9aa;margin-top:1px}
.rank-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.rank-row:last-child{border-bottom:none}
.rank-row.highlight{background:rgba(22,163,74,.18);margin:0 -8px;padding:8px 8px;border-radius:8px}
.rank-pos{font-size:13px;font-weight:800;color:#889;width:22px}
.rank-name{font-size:12px;font-weight:700;flex:1}
.rank-sub{font-size:10px;color:#9aa}
.rank-pct{font-size:14px;font-weight:800;text-align:right}
/* EXHIBICIONES */
.exhib-total-card{background:#17335e;color:#fff;border-radius:12px;padding:16px;margin-bottom:12px;text-align:center}
.exhib-total-pct{font-size:32px;font-weight:800}
.exhib-total-sub{font-size:11px;color:#aab;margin-top:4px}
.exhib-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.exhib-cadena-card{background:#fff;border-radius:10px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);text-align:center}
.exhib-cadena-pct{font-size:18px;font-weight:800}
.exhib-cadena-name{font-size:11px;font-weight:700;margin-top:2px}
.exhib-cadena-sub{font-size:10px;color:#888;margin-top:1px}
.exhib-badge{padding:1px 6px;border-radius:8px;font-size:9px;font-weight:700;display:inline-block;margin-top:3px}
.exhib-detail-item{padding:8px 12px;border-bottom:1px solid #faf6ee;font-size:11px}
.exhib-detail-item:last-child{border-bottom:none}
.exhib-detail-top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:2px}
.exhib-detail-meta{color:#888;font-size:10px}
/* VP */
.vp-nivel-badge{padding:2px 7px;border-radius:8px;font-size:9px;font-weight:800}
.vp-nivel-CRITICO{background:#fee2e2;color:#991b1b}
.vp-nivel-ALTO{background:#ffedd5;color:#c2410c}
.vp-nivel-MEDIO{background:#fef3c7;color:#92400e}
.vp-nivel-NORMAL{background:#dcfce7;color:#15803d}
.vp-acc-pill{padding:1px 6px;border-radius:6px;font-size:9px;font-weight:700;background:#f2e9da;color:#555}
.vp-acc-pill.q{background:#fee2e2;color:#991b1b}
.vp-acc-pill.r{background:#fef3c7;color:#92400e}
.vp-acc-pill.v{background:#dbeafe;color:#1d4ed8}
.vp-sku-table{width:100%;font-size:11px;border-collapse:collapse;margin-top:6px}
.vp-sku-table td{padding:5px 4px;border-bottom:1px solid #f6efe3}
.vp-isv-table{width:100%;font-size:11px;border-collapse:collapse}
.vp-isv-table th{background:#faf5ec;padding:6px;text-align:left;font-size:9px;color:#888;text-transform:uppercase}
.vp-isv-table td{padding:6px;border-bottom:1px solid #f6efe3}
.vp-prior-item{display:flex;gap:8px;padding:8px;background:#fff;border-radius:8px;margin-bottom:6px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.vp-prior-n{background:#2b5ea8;color:#fff;font-weight:800;font-size:11px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* INVNEG */
.invneg-table{width:100%;font-size:11px;border-collapse:collapse}
.invneg-table th{background:#faf5ec;padding:6px;text-align:left;font-size:9px;color:#888;text-transform:uppercase}
.invneg-table td{padding:6px;border-bottom:1px solid #f6efe3}
/* RESUMEN RUTA */
.recon-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.recon-card{background:#17335e;border-radius:12px;padding:12px;color:#fff}
.recon-card-label{font-size:9px;font-weight:700;letter-spacing:.4px;color:#9aa;text-transform:uppercase;margin-bottom:6px}
.recon-item{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.recon-item:last-child{border-bottom:none}
.recon-item-title{font-size:9px;color:#9aa;text-transform:uppercase;letter-spacing:.3px}
.recon-item-val{font-size:15px;font-weight:800;margin-top:2px}
.recon-item-sub{font-size:10px;color:#aab;margin-top:1px}
.rr-card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:8px;overflow:hidden;border-left:4px solid #eee1cb}
.rr-card.estado-SOBRE{border-left-color:#16a34a}.rr-card.estado-CIEN{border-left-color:#eab308}
.rr-card.estado-AMBAR{border-left-color:#d97706}.rr-card.estado-ATRASADA{border-left-color:#dc2626}
.rr-header{padding:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.rr-badge{font-size:9px;font-weight:800;padding:2px 7px;border-radius:8px;display:inline-block;margin-top:3px}
.rr-badge-SOBRE{background:#dcfce7;color:#15803d}.rr-badge-CIEN{background:#fef9c3;color:#854d0e}
.rr-badge-AMBAR{background:#fef3c7;color:#92400e}.rr-badge-ATRASADA{background:#fee2e2;color:#991b1b}
.rr-body{display:none;border-top:1px solid #f2e9da;padding:10px 12px}
.rr-body.open{display:block}
.rr-row{display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-bottom:1px solid #faf6ee}
.rr-row:last-child{border-bottom:none}
.rr-row-label{color:#888}
.rr-sala-item{padding:7px 0;border-bottom:1px solid #f6efe3;font-size:11px}
.rr-sala-item:last-child{border-bottom:none}
.rr-sala-top{display:flex;justify-content:space-between;font-weight:700}
.rr-ac-empty{font-size:11px;color:#999;background:#fbf7ef;border-radius:8px;padding:10px;margin-top:8px}

.dnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;background:rgba(255,255,255,.12);border-radius:10px;padding:6px 8px}
.dnav button{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:15px;font-weight:700;width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.dnav button:disabled{opacity:.3;cursor:default}
.dnav button:not(:disabled):hover{background:rgba(255,255,255,.3)}
.dnav-label{font-size:12px;font-weight:600;letter-spacing:.2px}

.bunting{width:100%;height:22px;display:block;background:#faf5ec}
</style>
<style id="ev-gate-css">
#ev-gate{display:none;max-width:380px;margin:28px auto;padding:22px 20px;background:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(45,15,69,.18);text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body.ev-lock #ev-gate{display:block}
#ev-gate h2{font-size:20px;color:#2d0f45;margin-bottom:4px}
#ev-gate p{font-size:13px;color:#6b5a7e;margin-bottom:14px}
#ev-gate input[type=text]{width:100%;font-size:22px;letter-spacing:2px;text-align:center;padding:12px;border:2px solid #e9d5ff;border-radius:12px;color:#2d0f45;background:#fff7ea;outline:none}
#ev-gate input[type=text]:focus{border-color:#f78c0b}
#ev-go{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:linear-gradient(90deg,#9c1f6e,#f78c0b);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
#ev-go[disabled]{opacity:.6}
#ev-gate label{display:block;margin-top:10px;font-size:12px;color:#6b5a7e}
#ev-err{min-height:18px;margin-top:10px;font-size:13px;font-weight:600;color:#dc2626}
#ev-out{position:fixed;right:10px;bottom:10px;z-index:200;padding:7px 12px;border-radius:999px;background:#2d0f45;color:#fff;font-size:12px;opacity:.85;cursor:pointer}
</style>
</head>
<body>
<div id="ev-gate">
  <h2>Evercracks 🌼</h2>
  <p id="ev-sub">Ingresa tu GPID para entrar</p>
  <input type="text" id="ev-gpid" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="GPID" aria-label="GPID">
  <button id="ev-go" type="button">Entrar</button>
  <label><input type="checkbox" id="ev-rem" checked> Recordarme en este teléfono</label>
