<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evercracks | Dashboards</title>
<meta name="theme-color" content="#14295e">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Evercracks">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fbf7ee;color:#14295e;min-height:100vh}
.header{background:#fbf7ee;padding:14px 16px 4px;text-align:center}
.header img{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
.header h1{font-size:22px;font-weight:800}
.header p{font-size:12px;opacity:.8;margin-top:4px}
.content{padding:16px;max-width:500px;margin:0 auto}
.section-title{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px;margin:20px 0 8px}
.month-header{font-size:12px;font-weight:800;color:#ff7a00;text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px;padding-bottom:4px;border-bottom:2px solid #f3e3c7}
.month-header:first-of-type{margin-top:4px}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:10px;display:flex;align-items:center;gap:14px;text-decoration:none;color:#14295e;border-left:4px solid #ff7a00}
.card-old{border-left-color:#ccc;opacity:.7}
.card-icon{font-size:20px;flex-shrink:0;background:#fff1de;border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#ff7a00;font-weight:800}
.card-title{font-size:14px;font-weight:700}
.card-sub{font-size:11px;color:#888;margin-top:2px}
.card-arrow{margin-left:auto;color:#ccc;font-size:18px}
.card-cierre{border-left-color:#14295e}
.card-icon-c{background:#e6ebf7;color:#14295e}
.tag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.5px;background:#ff7a00;color:#fff;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
details.month{margin-bottom:4px}
details.month>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;-webkit-tap-highlight-color:transparent}
details.month>summary::-webkit-details-marker{display:none}
details.month>summary::after{content:"\25B8";color:#ff7a00;font-size:14px;margin-left:0;transition:transform .2s}
details.month[open]>summary::after{transform:rotate(90deg)}
details.month>summary .count{font-size:10px;font-weight:600;color:#aaa;text-transform:none;letter-spacing:0;margin-left:auto;padding-right:8px}
.install-box{background:#fff;border-radius:12px;padding:14px;margin-top:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);border:1px dashed #ff7a00}
.install-box h3{font-size:13px;font-weight:700;color:#ff7a00;margin-bottom:6px}
.install-box p{font-size:12px;color:#555;line-height:1.6}
.footer{text-align:center;font-size:11px;color:#aaa;margin:24px 0 16px}
</style>
<style id="ev-gate-css">
#ev-gate{display:none;max-width:380px;margin:28px auto;padding:22px 20px;background:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(45,15,69,.18);text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body.ev-lock #ev-gate{display:block}
#ev-gate h2{font-size:20px;color:#2d0f45;margin-bottom:4px}
#ev-gate p{font-size:13px;color:#6b5a7e;margin-bottom:14px}
#ev-gate input[type=text]{width:100%;font-size:22px;letter-spacing:2px;text-align:center;padding:12px;border:2px solid #e9d5ff;border-radius:12px;color:#2d0f45;background:#fff7ea;outline:none}
#ev-gate input[type=text]:focus{border-color:#f78c0b}
#ev-go{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:linear-gradient(90deg,#9c1f6e,#f78c0b);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
#ev-go[disabled]{opacity:.6}
#ev-gate label{display:block;margin-top:10px;font-size:12px;color:#6b5a7e}
#ev-err{min-height:18px;margin-top:10px;font-size:13px;font-weight:600;color:#dc2626}
#ev-hi{position:fixed;top:12px;left:50%;transform:translate(-50%,-140%);z-index:300;max-width:calc(100% - 24px);padding:11px 20px;border-radius:999px;background:linear-gradient(90deg,#2d0f45,#9c1f6e);color:#fff;font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-shadow:0 6px 20px rgba(45,15,69,.35);transition:transform .45s cubic-bezier(.2,.9,.3,1.2),opacity .4s;opacity:0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ev-hi.on{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){#ev-hi{transition:none}}
#ev-out{position:fixed;right:10px;bottom:10px;z-index:200;padding:7px 12px;border-radius:999px;background:#2d0f45;color:#fff;font-size:12px;opacity:.85;cursor:pointer}
/* ev-gate-v4 */
body.ev-lock{background:radial-gradient(700px 420px at 50% -8%,rgba(217,154,43,.30) 0,transparent 65%),#faf6ed!important;min-height:100vh;overflow-x:hidden}
body.ev-lock #ev-gate{position:relative;max-width:360px;margin:max(36px,7vh) auto 0;padding:20px 22px 24px;background:#fff;border:1px solid #efe0bd;border-radius:26px;box-shadow:0 18px 44px rgba(17,17,17,.12),0 3px 0 #d99a2b}
#ev-gate .ev-logo{display:block;width:210px;max-width:72%;height:auto;margin:0 auto 4px;animation:ev-pop .7s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes ev-pop{from{transform:scale(.7) rotate(-5deg);opacity:0}to{transform:none;opacity:1}}
#ev-gate h2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#ev-gate .ev-zone{display:inline-block;margin:2px 0 14px;padding:3px 12px;border-radius:999px;background:#111;color:#f2b52b;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase}
#ev-gate p{color:#6b5f48;font-size:14px;margin-bottom:14px}
#ev-gate input[type=text]{background:#faf6ed;border:2px solid #ecd9a8;color:#111;font-weight:800;letter-spacing:5px;border-radius:16px;padding:14px}
#ev-gate input[type=text]::placeholder{color:#cdb98a;letter-spacing:4px;font-weight:700}
#ev-gate input[type=text]:focus{border-color:#d99a2b;box-shadow:0 0 0 4px rgba(217,154,43,.25)}
body.ev-lock #ev-go{background:#111!important;color:#f2b52b!important;border-radius:16px;padding:15px;font-size:17px;font-weight:800;letter-spacing:.6px;box-shadow:0 6px 0 #d99a2b,0 12px 22px rgba(17,17,17,.25);transition:transform .12s,box-shadow .12s}
body.ev-lock #ev-go:active{transform:translateY(4px);box-shadow:0 2px 0 #d99a2b}
#ev-gate label{color:#6b5f48;font-size:12.5px;margin-top:20px}
#ev-gate label input{accent-color:#111;vertical-align:-2px}
#ev-err{color:#dc2626}
#ev-hi{background:linear-gradient(90deg,#111,#2b2b2b)!important;color:#f2b52b!important}
#ev-out{background:#111!important;color:#f2b52b!important}
@media (prefers-reduced-motion:reduce){#ev-gate .ev-logo{animation:none}}
</style>
</head>

(function(){
  var KEY='ev_k', V=JSON.parse(document.getElementById('ev-vault').textContent);
  var $=function(i){return document.getElementById(i)};
  var enc=new TextEncoder(), dc=new TextDecoder();
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function u2b(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
  function hex(u){return Array.prototype.map.call(u,function(x){return ('0'+x.toString(16)).slice(-2)}).join('')}
  var S=window.crypto&&window.crypto.subtle;
  async function derive(g){var km=await S.importKey('raw',enc.encode(g),'PBKDF2',false,['deriveBits']);
    return new Uint8Array(await S.deriveBits({name:'PBKDF2',salt:b64(V.salt),iterations:V.iter,hash:'SHA-256'},km,256))}
  async function kid(K){return hex(new Uint8Array(await S.digest('SHA-256',K))).slice(0,16)}
  async function dec(K,o){var k=await S.importKey('raw',K,'AES-GCM',false,['decrypt']);
    return JSON.parse(dc.decode(await S.decrypt({name:'AES-GCM',iv:b64(o.iv)},k,b64(o.ct))))}
  function saludo(nombre){
    try{
      if(sessionStorage.getItem('ev_hi'))return;
      sessionStorage.setItem('ev_hi','1');
    }catch(e){}
    var h=new Date().getHours(), s=h<12?'Buenos días':h<20?'Buenas tardes':'Buenas noches';
    var n=String(nombre||'').trim().split(/\s+/)[0];
    var t=document.createElement('div');t.id='ev-hi';t.setAttribute('role','status');
    t.textContent=s+(n?', '+n:'')+' \uD83C\uDF3C';
    document.body.appendChild(t);
    var off=function(){t.classList.remove('on');setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t)},600)};
    t.onclick=off;
    setTimeout(function(){t.classList.add('on')},60);
    setTimeout(off,4200);
  }
  function boot(p,sh){
    window.EV_SESSION={mode:p.mode,ruta:p.ruta,nombre:p.nombre};
    if(p.ruta){try{localStorage.setItem('evercracks_mi_ruta',p.ruta)}catch(e){}}
    var tmp=document.createElement('div');tmp.innerHTML=sh.body;
    var scripts=[].slice.call(tmp.querySelectorAll('script')).map(function(s){var o={type:s.getAttribute('type'),text:s.textContent};s.parentNode.removeChild(s);return o});
    document.body.classList.remove('ev-lock');
    document.body.innerHTML='';
    while(tmp.firstChild)document.body.appendChild(tmp.firstChild);
    scripts.forEach(function(s){var n=document.createElement('script');if(s.type)n.setAttribute('type',s.type);n.textContent=s.text;document.body.appendChild(n)});
    if(p.ruta){try{irTab('miruta')}catch(e){}}
    var o=document.createElement('div');o.id='ev-out';o.textContent='Salir';
    o.onclick=function(){try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
    document.body.appendChild(o);
    saludo(p.nombre);
  }
  async function open(K){
    var id=await kid(K),u=V.users.filter(function(x){return x.kid===id})[0];
    if(!u)return false;
    try{var p=await dec(K,u),sh=await dec(b64(p.sk),V.shared);boot(p,sh);return true}catch(e){return false}
  }
  async function go(){
    var g=$('ev-gpid').value.replace(/\s+/g,'');
    if(!g){$('ev-err').textContent='Escribe tu GPID.';return}
    var rem=$('ev-rem').checked;
    $('ev-go').disabled=true;$('ev-err').textContent='';$('ev-go').textContent='Abriendo…';
    try{
      var K=await derive(g);
      if(await open(K)){
        if(rem){try{localStorage.setItem(KEY,u2b(K))}catch(e){}}
        return;
      }
      $('ev-err').textContent='No reconozco ese GPID. Revísalo e intenta de nuevo.';
    }catch(e){if($('ev-err'))$('ev-err').textContent='No pude abrir el acceso en este navegador. Prueba con Chrome o Safari actualizado.'}
    if($('ev-go')){$('ev-go').disabled=false;$('ev-go').textContent='Entrar'}
  }
  document.body.classList.add('ev-lock');
  if(!S){$('ev-err').textContent='Abre este link con https en Chrome o Safari.';$('ev-go').disabled=true;return}
  $('ev-go').onclick=go;
  $('ev-gpid').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
  var saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  if(saved){$('ev-sub').textContent='Abriendo…';
    open(b64(saved)).then(function(ok){if(!ok){try{localStorage.removeItem(KEY)}catch(e){}$('ev-sub').textContent='Ingresa tu GPID para entrar'}})
      .catch(function(){$('ev-sub').textContent='Ingresa tu GPID para entrar'})}
})();
</script>
