<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evercracks | Dashboards</title>
<meta name="theme-color" content="#14295e">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Evercracks">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fbf7ee;color:#14295e;min-height:100vh}
.header{background:#fbf7ee;padding:14px 16px 4px;text-align:center}
.header img{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
.header h1{font-size:22px;font-weight:800}
.header p{font-size:12px;opacity:.8;margin-top:4px}
.content{padding:16px;max-width:500px;margin:0 auto}
.section-title{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px;margin:20px 0 8px}
.month-header{font-size:12px;font-weight:800;color:#ff7a00;text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px;padding-bottom:4px;border-bottom:2px solid #f3e3c7}
.month-header:first-of-type{margin-top:4px}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:10px;display:flex;align-items:center;gap:14px;text-decoration:none;color:#14295e;border-left:4px solid #ff7a00}
.card-old{border-left-color:#ccc;opacity:.7}
.card-icon{font-size:20px;flex-shrink:0;background:#fff1de;border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#ff7a00;font-weight:800}
.card-title{font-size:14px;font-weight:700}
.card-sub{font-size:11px;color:#888;margin-top:2px}
.card-arrow{margin-left:auto;color:#ccc;font-size:18px}
.card-cierre{border-left-color:#14295e}
.card-icon-c{background:#e6ebf7;color:#14295e}
.tag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.5px;background:#ff7a00;color:#fff;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
details.month{margin-bottom:4px}
details.month>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;-webkit-tap-highlight-color:transparent}
details.month>summary::-webkit-details-marker{display:none}
details.month>summary::after{content:"\25B8";color:#ff7a00;font-size:14px;margin-left:0;transition:transform .2s}
details.month[open]>summary::after{transform:rotate(90deg)}
details.month>summary .count{font-size:10px;font-weight:600;color:#aaa;text-transform:none;letter-spacing:0;margin-left:auto;padding-right:8px}
.install-box{background:#fff;border-radius:12px;padding:14px;margin-top:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);border:1px dashed #ff7a00}
.install-box h3{font-size:13px;font-weight:700;color:#ff7a00;margin-bottom:6px}
.install-box p{font-size:12px;color:#555;line-height:1.6}
.footer{text-align:center;font-size:11px;color:#aaa;margin:24px 0 16px}
</style>
<style id="ev-gate-css">
#ev-gate{display:none;max-width:380px;margin:28px auto;padding:22px 20px;background:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.18);text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body.ev-lock #ev-gate{display:block}
#ev-gate h2{font-size:20px;color:#111111;margin-bottom:4px}
#ev-gate p{font-size:13px;color:#6b7280;margin-bottom:14px}
#ev-gate input[type=text]{width:100%;font-size:22px;letter-spacing:2px;text-align:center;padding:12px;border:2px solid #e9d5ff;border-radius:12px;color:#111111;background:#f5f7fb;outline:none}
#ev-gate input[type=text]:focus{border-color:#facc15}
#ev-go{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:linear-gradient(90deg,#262626,#facc15);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
#ev-go[disabled]{opacity:.6}
#ev-gate label{display:block;margin-top:10px;font-size:12px;color:#6b7280}
#ev-err{min-height:18px;margin-top:10px;font-size:13px;font-weight:600;color:#dc2626}
#ev-hi{position:fixed;top:12px;left:50%;transform:translate(-50%,-140%);z-index:300;max-width:calc(100% - 24px);padding:11px 20px;border-radius:999px;background:linear-gradient(90deg,#111111,#262626);color:#fff;font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.35);transition:transform .45s cubic-bezier(.2,.9,.3,1.2),opacity .4s;opacity:0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ev-hi.on{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){#ev-hi{transition:none}}
#ev-out{position:fixed;right:10px;bottom:10px;z-index:200;padding:7px 12px;border-radius:999px;background:#111111;color:#fff;font-size:12px;opacity:.85;cursor:pointer}

#ev-go{background:#111!important;color:#facc15!important}
/* ev-gate-v5 */
body.ev-lock{background:radial-gradient(520px 380px at 85% 4%,rgba(242,181,43,.40) 0,transparent 65%),radial-gradient(520px 420px at 0% 100%,rgba(217,154,43,.28) 0,transparent 65%),#0e0e0e!important;min-height:100vh;overflow-x:hidden}
body.ev-lock #ev-gate{position:relative;max-width:360px;margin:max(150px,21vh) auto 0;padding:22px 22px 26px;background:#faf6ed;border:3px solid #d99a2b;border-radius:30px;box-shadow:0 0 0 7px rgba(242,181,43,.16),0 28px 60px rgba(0,0,0,.65)}
#ev-gate .ev-logo{display:block;width:215px;max-width:70%;height:auto;margin:6px auto 2px;animation:ev-pop .8s cubic-bezier(.2,.9,.3,1.3) both}
#ev-gate .ev-mascot{position:absolute;right:6px;top:-132px;height:156px;width:auto;pointer-events:none;transform-origin:50% 100%;filter:drop-shadow(0 10px 14px rgba(0,0,0,.6));animation:ev-wave 2.6s ease-in-out infinite}
#ev-gate .ev-chip{position:absolute;width:16px;height:14px;background:#f2b52b;clip-path:polygon(50% 0,0 100%,100% 100%);opacity:.9;pointer-events:none;animation:ev-drift 4s ease-in-out infinite}
#ev-gate .ev-chip:nth-of-type(1){left:-8px;top:-44px;animation-delay:0s}
#ev-gate .ev-chip:nth-of-type(2){left:-6px;top:120px;width:11px;height:10px;animation-delay:.8s}
#ev-gate .ev-chip:nth-of-type(3){right:-8px;top:150px;animation-delay:1.4s}
#ev-gate .ev-chip:nth-of-type(4){left:30px;top:-70px;width:10px;height:9px;animation-delay:2s}
#ev-gate .ev-chip:nth-of-type(5){right:-6px;bottom:30px;width:12px;height:11px;animation-delay:.4s}
#ev-gate .ev-chip:nth-of-type(6){left:-8px;bottom:-30px;animation-delay:1.1s}
@keyframes ev-pop{from{transform:scale(.7) rotate(-5deg);opacity:0}to{transform:none;opacity:1}}
@keyframes ev-wave{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes ev-drift{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(40deg)}}
#ev-gate h2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#ev-gate .ev-zone{display:inline-block;margin:2px 0 14px;padding:4px 14px;border-radius:999px;background:#111;color:#f2b52b;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
#ev-gate p{color:#5a4f3a;font-size:14.5px;font-weight:600;margin-bottom:14px}
#ev-gate input[type=text]{background:#fff;border:2.5px solid #111;color:#111;font-weight:800;letter-spacing:6px;border-radius:16px;padding:15px;font-size:24px}
#ev-gate input[type=text]::placeholder{color:#c4b184;letter-spacing:5px;font-weight:700}
#ev-gate input[type=text]:focus{border-color:#d99a2b;box-shadow:0 0 0 4px rgba(217,154,43,.35)}
body.ev-lock #ev-go{background:linear-gradient(180deg,#ffd84d,#f2b52b)!important;color:#111!important;border-radius:16px;padding:16px;font-size:18px;font-weight:900;letter-spacing:.8px;box-shadow:0 6px 0 #8a5a00,0 14px 24px rgba(0,0,0,.35);transition:transform .12s,box-shadow .12s;animation:ev-pulse 2.4s ease-in-out infinite}
body.ev-lock #ev-go:active{transform:translateY(5px);box-shadow:0 1px 0 #8a5a00}
@keyframes ev-pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.1)}}
#ev-gate label{color:#5a4f3a;font-size:12.5px;margin-top:20px}
#ev-gate label input{accent-color:#111;vertical-align:-2px}
#ev-err{color:#dc2626}
#ev-hi{background:linear-gradient(90deg,#111,#2b2b2b)!important;color:#f2b52b!important}
#ev-out{background:#111!important;color:#f2b52b!important}
@media (prefers-reduced-motion:reduce){#ev-gate .ev-logo,#ev-gate .ev-mascot,#ev-gate .ev-chip,body.ev-lock #ev-go{animation:none}}
#ev-gate p.ev-nota{font-size:12.5px;font-weight:500;margin:20px 0 0}
</style>
</head>

(function(){
  var KEY='ev_kd', hoy=function(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}, V=JSON.parse(document.getElementById('ev-vault').textContent);
  var $=function(i){return document.getElementById(i)};
  var enc=new TextEncoder(), dc=new TextDecoder();
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function u2b(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
  function hex(u){return Array.prototype.map.call(u,function(x){return ('0'+x.toString(16)).slice(-2)}).join('')}
  var S=window.crypto&&window.crypto.subtle;
  async function derive(g){var km=await S.importKey('raw',enc.encode(g),'PBKDF2',false,['deriveBits']);
    return new Uint8Array(await S.deriveBits({name:'PBKDF2',salt:b64(V.salt),iterations:V.iter,hash:'SHA-256'},km,256))}
  async function kid(K){return hex(new Uint8Array(await S.digest('SHA-256',K))).slice(0,16)}
  async function dec(K,o){var k=await S.importKey('raw',K,'AES-GCM',false,['decrypt']);
    return JSON.parse(dc.decode(await S.decrypt({name:'AES-GCM',iv:b64(o.iv)},k,b64(o.ct))))}
  function saludo(nombre){
    try{
      if(sessionStorage.getItem('ev_hi'))return;
      sessionStorage.setItem('ev_hi','1');
    }catch(e){}
    var h=new Date().getHours(), s=h<12?'Buenos días':h<20?'Buenas tardes':'Buenas noches';
    var n=String(nombre||'').trim().split(/\s+/)[0];

    t.textContent=s+(n?', '+n:'')+' \u2728';
    document.body.appendChild(t);
    var off=function(){t.classList.remove('on');setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t)},600)};
    t.onclick=off;
    setTimeout(function(){t.classList.add('on')},60);
    setTimeout(off,4200);
  }
  function boot(p,sh){
    window.EV_SESSION={mode:p.mode,ruta:p.ruta,nombre:p.nombre};
    if(p.ruta){try{localStorage.setItem('evercracks_mi_ruta',p.ruta)}catch(e){}}
    var tmp=document.createElement('div');tmp.innerHTML=sh.body;
    var scripts=[].slice.call(tmp.querySelectorAll('script')).map(function(s){var o={type:s.getAttribute('type'),text:s.textContent};s.parentNode.removeChild(s);return o});
    document.body.classList.remove('ev-lock');
    document.body.innerHTML='';
    while(tmp.firstChild)document.body.appendChild(tmp.firstChild);
    scripts.forEach(function(s){var n=document.createElement('script');if(s.type)n.setAttribute('type',s.type);n.textContent=s.text;document.body.appendChild(n)});
    if(p.ruta){try{irTab('miruta')}catch(e){}}

    o.onclick=function(){try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
    document.body.appendChild(o);
