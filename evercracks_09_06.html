<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f7fb;color:#1a1a2e;font-size:14px}
.header{background:#0070f3;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,112,243,.4)}
.header-top{display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:17px;font-weight:700;letter-spacing:.3px}
.header .meta{font-size:11px;opacity:.85;margin-top:2px}
.badge{background:rgba(255,255,255,.2);padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:2px solid #e8edf5;position:sticky;top:57px;z-index:99;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 14px;white-space:nowrap;cursor:pointer;font-size:13px;font-weight:500;color:#666;border-bottom:3px solid transparent;margin-bottom:-2px;flex-shrink:0;transition:color .2s}
.tab.active{color:#0070f3;border-bottom-color:#0070f3;font-weight:700}
.panel{display:none;padding:14px}
.panel.active{display:block}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi-card{background:#fff;border-radius:10px;padding:11px 10px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center;border-top:3px solid #e8edf5}
.kpi-card.green{border-top-color:#16a34a}.kpi-card.amber{border-top-color:#d97706}.kpi-card.red{border-top-color:#dc2626}
.kpi-label{font-size:10px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi-value{font-size:18px;font-weight:800;margin-top:3px;line-height:1}
.kpi-sub{font-size:10px;color:#999;margin-top:2px}
.section-title{font-size:12px;font-weight:700;color:#444;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.section-title::after{content:'';flex:1;height:1px;background:#e8edf5}
.canal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.canal-card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.canal-label{font-size:11px;font-weight:700;color:#fff;padding:2px 8px;border-radius:12px;display:inline-block;margin-bottom:8px}
.canal-whs{background:#7c3aed}.canal-smk{background:#ea580c}
.canal-net{font-size:20px;font-weight:800}
.canal-tgt{font-size:11px;color:#888;margin-top:1px}
.progress-bar{height:6px;background:#f0f0f0;border-radius:3px;margin:6px 0;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .4s}
.fill-green{background:#16a34a}.fill-amber{background:#d97706}.fill-red{background:#dc2626}
.canal-stats{display:flex;gap:10px;font-size:11px;color:#666;margin-top:4px;flex-wrap:wrap}
.stat-val{font-weight:700}
.ruta-list{display:flex;flex-direction:column;gap:6px}
.ruta-bar-item{background:#fff;border-radius:8px;padding:9px 10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ruta-bar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.ruta-name{font-size:12px;font-weight:700}
.ruta-pct{font-size:13px;font-weight:800}
.ruta-bar-meta{font-size:10px;color:#888}
.analysis-box{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:8px}
.analysis-box h3{font-size:12px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.analysis-box p{font-size:12px;color:#555;line-height:1.6}
.tag{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;margin-right:4px}
.tag-green{background:#dcfce7;color:#15803d}.tag-amber{background:#fef3c7;color:#92400e}.tag-red{background:#fee2e2;color:#991b1b}
.subcad-list{display:flex;flex-direction:column;gap:6px}
.subcad-item{background:#fff;border-radius:8px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.subcad-top{display:flex;justify-content:space-between;align-items:center}
.subcad-name{font-size:13px;font-weight:700}
.subcad-meta{display:flex;gap:10px;font-size:11px;color:#888;flex-wrap:wrap;margin-top:4px}
.semaforo{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}
.sem-green{background:#16a34a}.sem-amber{background:#d97706}.sem-red{background:#dc2626}
.ruta-card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:8px;overflow:hidden}
.ruta-card-header{padding:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
.ruta-card-header:active{background:#f8f9fb}
.ruta-card-arrow{font-size:12px;color:#999;transition:transform .2s}
.ruta-card-arrow.open{transform:rotate(180deg)}
.ruta-card-body{display:none;border-top:1px solid #f0f0f0}
.ruta-card-body.open{display:block}
.sala-row{padding:8px 12px;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #f8f9fb;font-size:12px}
.sala-row:last-child{border-bottom:none}
.sala-name{font-weight:600;flex:1}
.sala-stats{display:flex;gap:8px;font-size:11px;flex-shrink:0}
.ddv-block{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:12px}
.ddv-title{font-size:12px;font-weight:700;color:#444;margin-bottom:10px}
.ddv-nums{display:flex;margin-bottom:8px}
.ddv-num{text-align:center;flex:1}
.ddv-num-val{font-size:24px;font-weight:800;line-height:1}
.ddv-num-lbl{font-size:10px;color:#888;margin-top:2px}
.ddv-progress{height:10px;background:#f0f0f0;border-radius:5px;overflow:hidden}
.ddv-fill{height:100%;border-radius:5px;background:#0070f3}
.ot-filters{display:flex;gap:6px;margin-bottom:10px}
.ot-filter{padding:5px 12px;border-radius:20px;border:1px solid #ddd;background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:#666}
.ot-filter.active{background:#0070f3;color:#fff;border-color:#0070f3}
.ot-table{width:100%;border-collapse:collapse;font-size:12px}
.ot-table th{background:#f5f7fb;padding:7px 8px;text-align:left;font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.3px}
.ot-table td{padding:7px 8px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
.ot-table tr:hover td{background:#f9fafc}
.ot-ruta-row td{background:#f0f4ff!important;font-weight:700;font-size:12px}
.ot-subtotal-row td{background:#eef2ff!important;font-weight:700}
.ot-total-row td{background:#1a1a2e!important;color:#fff!important;font-weight:800;font-size:12px}
.ot-total-row td span{color:#fff!important}
.canal-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.dot-whs{background:#7c3aed}.dot-smk{background:#ea580c}
.alert-list{display:flex;flex-direction:column;gap:8px}
.alert-item{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid #e8edf5;display:flex;gap:10px;align-items:flex-start}
.alert-item.success{border-left-color:#16a34a}.alert-item.warning{border-left-color:#d97706}
.alert-item.danger{border-left-color:#dc2626}.alert-item.info{border-left-color:#0070f3}
.alert-icon{font-size:18px;line-height:1;flex-shrink:0}
.alert-text h4{font-size:13px;font-weight:700;margin-bottom:3px}
.alert-text p{font-size:12px;color:#666;line-height:1.4}
.green-txt{color:#16a34a}.amber-txt{color:#d97706}.red-txt{color:#dc2626}
.purple-txt{color:#7c3aed}.orange-txt{color:#ea580c}
.mt12{margin-top:12px}
.pill{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.pill-green{background:#dcfce7;color:#15803d}.pill-amber{background:#fef3c7;color:#92400e}.pill-red{background:#fee2e2;color:#991b1b}
.table-scroll{overflow-x:auto}
.inicio-badge{background:#dbeafe;color:#1d4ed8;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;margin-bottom:12px;border-left:4px solid #2563eb}
</style>

<script>
(function(){
  var KEY='ev_k', V=JSON.parse(document.getElementById('ev-vault').textContent);
  var $=function(i){return document.getElementById(i)};
  var enc=new TextEncoder(), dc=new TextDecoder();
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function u2b(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
  function hex(u){return Array.prototype.map.call(u,function(x){return ('0'+x.toString(16)).slice(-2)}).join('')}
  var S=window.crypto&&window.crypto.subtle;
  async function derive(g){var km=await S.importKey('raw',enc.encode(g),'PBKDF2',false,['deriveBits']);
    return new Uint8Array(await S.deriveBits({name:'PBKDF2',salt:b64(V.salt),iterations:V.iter,hash:'SHA-256'},km,256))}
  async function kid(K){return hex(new Uint8Array(await S.digest('SHA-256',K))).slice(0,16)}
  async function dec(K,o){var k=await S.importKey('raw',K,'AES-GCM',false,['decrypt']);
    return JSON.parse(dc.decode(await S.decrypt({name:'AES-GCM',iv:b64(o.iv)},k,b64(o.ct))))}
  function boot(p,sh){
    window.EV_SESSION={mode:p.mode,ruta:p.ruta,nombre:p.nombre};
    if(p.ruta){try{localStorage.setItem('evercracks_mi_ruta',p.ruta)}catch(e){}}
    var tmp=document.createElement('div');tmp.innerHTML=sh.body;
    var scripts=[].slice.call(tmp.querySelectorAll('script')).map(function(s){var o={type:s.getAttribute('type'),text:s.textContent};s.parentNode.removeChild(s);return o});
    document.body.classList.remove('ev-lock');
    document.body.innerHTML='';
    while(tmp.firstChild)document.body.appendChild(tmp.firstChild);
    scripts.forEach(function(s){var n=document.createElement('script');if(s.type)n.setAttribute('type',s.type);n.textContent=s.text;document.body.appendChild(n)});
    if(p.ruta){try{irTab('miruta')}catch(e){}}
    var o=document.createElement('div');o.id='ev-out';o.textContent='Salir';
    o.onclick=function(){try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
    document.body.appendChild(o);
  }
  async function open(K){
    var id=await kid(K),u=V.users.filter(function(x){return x.kid===id})[0];
    if(!u)return false;
    try{var p=await dec(K,u),sh=await dec(b64(p.sk),V.shared);boot(p,sh);return true}catch(e){return false}
  }
  async function go(){
    var g=$('ev-gpid').value.replace(/\s+/g,'');
    if(!g){$('ev-err').textContent='Escribe tu GPID.';return}
    var rem=$('ev-rem').checked;
    $('ev-go').disabled=true;$('ev-err').textContent='';$('ev-go').textContent='Abriendo…';
    try{
      var K=await derive(g);
      if(await open(K)){
        if(rem){try{localStorage.setItem(KEY,u2b(K))}catch(e){}}
        return;
      }
      $('ev-err').textContent='No reconozco ese GPID. Revísalo e intenta de nuevo.';
    }catch(e){if($('ev-err'))$('ev-err').textContent='No pude abrir el acceso en este navegador. Prueba con Chrome o Safari actualizado.'}
    if($('ev-go')){$('ev-go').disabled=false;$('ev-go').textContent='Entrar'}
  }
  document.body.classList.add('ev-lock');
  if(!S){$('ev-err').textContent='Abre este link con https en Chrome o Safari.';$('ev-go').disabled=true;return}
  $('ev-go').onclick=go;
  $('ev-gpid').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
  var saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  if(saved){$('ev-sub').textContent='Abriendo…';
    open(b64(saved)).then(function(ok){if(!ok){try{localStorage.removeItem(KEY)}catch(e){}$('ev-sub').textContent='Ingresa tu GPID para entrar'}})
      .catch(function(){$('ev-sub').textContent='Ingresa tu GPID para entrar'})}
})();
