<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff7ea;color:#2d0f45;font-size:14px}
.header{background:linear-gradient(180deg,#2d0f45 0%,#9c1f6e 100%);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(45,15,69,.45)}
.header-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.header h1{font-size:17px;font-weight:700;letter-spacing:.3px}
.header .meta{font-size:11px;opacity:.85;margin-top:2px}
.badge{background:#f78c0b;color:#2d0f45;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.hdr-logo{width:32px;height:32px;border-radius:9px;vertical-align:-8px;margin-right:9px;box-shadow:0 0 0 2px rgba(240,127,30,.7)}
.back{display:inline-block;margin-top:8px;color:#fff;text-decoration:none;font-size:12px;font-weight:600;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:8px}
.bunting{height:22px;background:#fff7ea url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='22' viewBox='0 0 60 22'><rect width='60' height='4' fill='%23f78c0b'/><polygon points='0,4 12,4 6,20' fill='%23d6336c'/><polygon points='12,4 24,4 18,20' fill='%23f78c0b'/><polygon points='24,4 36,4 30,20' fill='%230f8b8d'/><polygon points='36,4 48,4 42,20' fill='%23ffc233'/><polygon points='48,4 60,4 54,20' fill='%237c3aa8'/></svg>") repeat-x}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 28px}
h2{font-size:14px;font-weight:800;color:#2d0f45;margin:20px 0 8px;display:flex;align-items:center;gap:8px}
h2 small{font-size:11px;font-weight:500;color:#8a7a99}
.sub{font-size:12px;color:#6f5a80;line-height:1.5}
.green-txt{color:#16a34a}.amber-txt{color:#d97706}.red-txt{color:#dc2626}
.hero{background:#2d0f45;color:#fff;border-radius:14px;padding:16px 16px 14px}
.hero-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-1px}
.big small{font-size:15px;font-weight:600;opacity:.75;letter-spacing:0;margin-left:4px}
.hero-l{font-size:15px;font-weight:600;opacity:.8;margin-top:6px}
.nw{white-space:nowrap}
.state{font-size:12px;font-weight:700;padding:4px 10px;border-radius:14px;white-space:nowrap;flex-shrink:0;max-width:100%;color:#fff}
.state.ok{background:#16a34a}.state.amb{background:#d97706}.state.bad{background:#dc2626}
.track{position:relative;height:12px;background:rgba(255,255,255,.16);border-radius:6px;margin:18px 0 6px}
.track-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:#fff}
.track-mark{position:absolute;top:-6px;bottom:-6px;width:3px;background:#f78c0b;border-radius:2px}
.track-legend{display:flex;justify-content:space-between;gap:8px;font-size:11px;opacity:.85;flex-wrap:wrap}
.track-legend b{color:#f78c0b}
.need{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.15);display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.need div{font-size:11px;opacity:.85;line-height:1.3}
.need b{display:block;font-size:17px;color:#fff;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mini{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 4px rgba(45,15,69,.08);border-top:3px solid #f0d9bf}
.mini.whs{border-top-color:#d9531e}.mini.smk{border-top-color:#0f8b8d}
.mini-l{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.mini.whs .mini-l{color:#d9531e}.mini.smk .mini-l{color:#0f8b8d}
.mini-v{font-size:24px;font-weight:800;margin-top:4px}
.mini-s{font-size:11px;color:#8a7a99;margin-top:2px;line-height:1.4}
.mini-row{display:flex;justify-content:space-between;font-size:12px;margin-top:6px;gap:6px}
.mini-row span:first-child{color:#8a7a99}
.mini-row b{font-weight:800}
.bench{background:#2d0f45;border-radius:12px;padding:14px;color:#fff}
.bench-t{font-size:11px;font-weight:700;letter-spacing:.4px;color:#c9b8da;margin-bottom:8px;text-transform:uppercase}
.brow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.brow:last-child{border-bottom:none}
.brow.me{background:rgba(22,163,74,.2);margin:0 -8px;padding:8px;border-radius:8px;border-bottom:none}
.brow-n{font-size:13px;font-weight:700}
.brow-n small{display:block;font-size:10px;font-weight:500;color:#c9b8da}
.brow-v{text-align:right;font-size:17px;font-weight:800}
.brow-v small{display:block;font-size:10px;font-weight:500;color:#c9b8da}
.pos{display:inline-block;width:22px;font-size:13px;font-weight:800;color:#c9b8da}
.me .pos{color:#fff}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(45,15,69,.08);margin-bottom:8px;overflow:hidden;border-left:4px solid #f0d9bf}
.card.ok{border-left-color:#16a34a}.card.amb{border-left-color:#d97706}.card.bad{border-left-color:#dc2626}
.card-h{width:100%;display:flex;align-items:center;gap:10px;padding:12px;background:none;border:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.card-main{flex:1;min-width:0}
.card-t{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{font-size:10px;font-weight:800;padding:2px 7px;border-radius:8px;color:#fff}
.chip.WHS{background:#d9531e}.chip.SMK{background:#0f8b8d}
.card-s{font-size:11px;color:#8a7a99;margin-top:3px}
.card-pct{text-align:right;flex-shrink:0}
.card-pct b{display:block;font-size:20px;font-weight:800}
.card-pct small{font-size:10px;color:#8a7a99}
.arrow{color:#b3237a;font-size:12px;transition:transform .2s;flex-shrink:0}
.card.open .arrow{transform:rotate(180deg)}
.card-body{display:none;padding:0 12px 12px;border-top:1px solid #f5e6d2}
.card.open .card-body{display:block}
.sala{padding:10px 0;border-bottom:1px solid #f5e6d2}
.sala:last-child{border-bottom:none}
.sala-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sala-n{font-size:13px;font-weight:700;min-width:0}
.sala-n small{display:block;font-size:11px;font-weight:500;color:#8a7a99;margin-top:1px;overflow-wrap:anywhere}
.sala-p{font-size:15px;font-weight:800;flex-shrink:0}
.sala-g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;font-size:11px;color:#8a7a99}
.sala-g b{display:block;font-size:12px;color:#2d0f45}
.pbar{height:6px;background:#f5e6d2;border-radius:3px;margin-top:8px;position:relative}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.pbar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:#2d0f45;opacity:.5}
.seg{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.seg button{border:1px solid #f0d9bf;background:#fff;color:#6f5a80;font:inherit;font-size:12px;font-weight:700;padding:6px 12px;border-radius:16px;cursor:pointer}
.seg button.on{background:#2d0f45;color:#fff;border-color:#2d0f45}
.rec{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rec-c{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 4px rgba(45,15,69,.08);border-top:3px solid #f78c0b}
.rec-c .l{font-size:11px;color:#8a7a99;line-height:1.3}
.rec-c .v{font-size:20px;font-weight:800;margin-top:4px}
.rec-c .s{font-size:12px;font-weight:700;margin-top:2px}
.rec-wide{grid-column:1/-1}
.cmp{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(45,15,69,.08);padding:4px 12px}
.cmp table{width:100%;border-collapse:collapse;font-size:12px}
.cmp th{font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:#8a7a99;text-align:right;padding:8px 0 6px;font-weight:700}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp td{padding:7px 0;border-top:1px solid #f5e6d2;text-align:right;white-space:nowrap}
.cmp td:first-child{font-weight:700;white-space:normal}
.chg{margin-top:10px}
.chg-i{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:6px;box-shadow:0 1px 3px rgba(45,15,69,.07);border-left:4px solid #b3237a;font-size:12px;line-height:1.45}
.chg-i b{color:#2d0f45}
.note{font-size:11px;color:#8a7a99;line-height:1.5;margin-top:10px}
.foot{text-align:center;font-size:11px;color:#a898bb;margin-top:22px}
@media(max-width:380px){.big{font-size:38px}.need b{font-size:15px}.mini-v{font-size:21px}}
</style>
<style id="ev-gate-css">
#ev-gate{display:none;max-width:380px;margin:28px auto;padding:22px 20px;background:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.18);text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body.ev-lock #ev-gate{display:block}
#ev-gate h2{font-size:20px;color:#111111;margin-bottom:4px}
#ev-gate p{font-size:13px;color:#6b7280;margin-bottom:14px}
#ev-gate input[type=text]{width:100%;font-size:22px;letter-spacing:2px;text-align:center;padding:12px;border:2px solid #e9d5ff;border-radius:12px;color:#111111;background:#f5f7fb;outline:none}
#ev-gate input[type=text]:focus{border-color:#facc15}
#ev-go{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:linear-gradient(90deg,#262626,#facc15);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
#ev-go[disabled]{opacity:.6}
#ev-gate label{display:block;margin-top:10px;font-size:12px;color:#6b7280}
#ev-err{min-height:18px;margin-top:10px;font-size:13px;font-weight:600;color:#dc2626}
#ev-hi{position:fixed;top:12px;left:50%;transform:translate(-50%,-140%);z-index:300;max-width:calc(100% - 24px);padding:11px 20px;border-radius:999px;background:linear-gradient(90deg,#111111,#262626);color:#fff;font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.35);transition:transform .45s cubic-bezier(.2,.9,.3,1.2),opacity .4s;opacity:0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ev-hi.on{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){#ev-hi{transition:none}}
#ev-out{position:fixed;right:10px;bottom:10px;z-index:200;padding:7px 12px;border-radius:999px;background:#111111;color:#fff;font-size:12px;opacity:.85;cursor:pointer}

#ev-go{background:#111!important;color:#facc15!important}
/* ev-gate-v5 */
body.ev-lock{background:radial-gradient(520px 380px at 85% 4%,rgba(242,181,43,.40) 0,transparent 65%),radial-gradient(520px 420px at 0% 100%,rgba(217,154,43,.28) 0,transparent 65%),#0e0e0e!important;min-height:100vh;overflow-x:hidden}
body.ev-lock #ev-gate{position:relative;max-width:360px;margin:max(150px,21vh) auto 0;padding:22px 22px 26px;background:#faf6ed;border:3px solid #d99a2b;border-radius:30px;box-shadow:0 0 0 7px rgba(242,181,43,.16),0 28px 60px rgba(0,0,0,.65)}
#ev-gate .ev-logo{display:block;width:215px;max-width:70%;height:auto;margin:6px auto 2px;animation:ev-pop .8s cubic-bezier(.2,.9,.3,1.3) both}
#ev-gate .ev-mascot{position:absolute;right:6px;top:-132px;height:156px;width:auto;pointer-events:none;transform-origin:50% 100%;filter:drop-shadow(0 10px 14px rgba(0,0,0,.6));animation:ev-wave 2.6s ease-in-out infinite}
#ev-gate .ev-chip{position:absolute;width:16px;height:14px;background:#f2b52b;clip-path:polygon(50% 0,0 100%,100% 100%);opacity:.9;pointer-events:none;animation:ev-drift 4s ease-in-out infinite}
#ev-gate .ev-chip:nth-of-type(1){left:-8px;top:-44px;animation-delay:0s}
#ev-gate .ev-chip:nth-of-type(2){left:-6px;top:120px;width:11px;height:10px;animation-delay:.8s}
#ev-gate .ev-chip:nth-of-type(3){right:-8px;top:150px;animation-delay:1.4s}
#ev-gate .ev-chip:nth-of-type(4){left:30px;top:-70px;width:10px;height:9px;animation-delay:2s}
#ev-gate .ev-chip:nth-of-type(5){right:-6px;bottom:30px;width:12px;height:11px;animation-delay:.4s}
#ev-gate .ev-chip:nth-of-type(6){left:-8px;bottom:-30px;animation-delay:1.1s}
@keyframes ev-pop{from{transform:scale(.7) rotate(-5deg);opacity:0}to{transform:none;opacity:1}}
@keyframes ev-wave{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes ev-drift{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(40deg)}}
#ev-gate h2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#ev-gate .ev-zone{display:inline-block;margin:2px 0 14px;padding:4px 14px;border-radius:999px;background:#111;color:#f2b52b;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
#ev-gate p{color:#5a4f3a;font-size:14.5px;font-weight:600;margin-bottom:14px}
#ev-gate input[type=text]{background:#fff;border:2.5px solid #111;color:#111;font-weight:800;letter-spacing:6px;border-radius:16px;padding:15px;font-size:24px}
#ev-gate input[type=text]::placeholder{color:#c4b184;letter-spacing:5px;font-weight:700}
#ev-gate input[type=text]:focus{border-color:#d99a2b;box-shadow:0 0 0 4px rgba(217,154,43,.35)}
body.ev-lock #ev-go{background:linear-gradient(180deg,#ffd84d,#f2b52b)!important;color:#111!important;border-radius:16px;padding:16px;font-size:18px;font-weight:900;letter-spacing:.8px;box-shadow:0 6px 0 #8a5a00,0 14px 24px rgba(0,0,0,.35);transition:transform .12s,box-shadow .12s;animation:ev-pulse 2.4s ease-in-out infinite}
body.ev-lock #ev-go:active{transform:translateY(5px);box-shadow:0 1px 0 #8a5a00}
@keyframes ev-pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.1)}}
#ev-gate label{color:#5a4f3a;font-size:12.5px;margin-top:20px}
#ev-gate label input{accent-color:#111;vertical-align:-2px}
#ev-err{color:#dc2626}
#ev-hi{background:linear-gradient(90deg,#111,#2b2b2b)!important;color:#f2b52b!important}
#ev-out{background:#111!important;color:#f2b52b!important}
@media (prefers-reduced-motion:reduce){#ev-gate .ev-logo,#ev-gate .ev-mascot,#ev-gate .ev-chip,body.ev-lock #ev-go{animation:none}}
</style>
</head>

(function(){
  var KEY='ev_k', V=JSON.parse(document.getElementById('ev-vault').textContent);
  var $=function(i){return document.getElementById(i)};
