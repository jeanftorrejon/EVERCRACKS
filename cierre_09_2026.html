  return `<div class="sala"><div class="sala-h"><div class="sala-n">${esc(s.sub)} · ${esc(s.id)}<small>${esc(s.dir||s.cli)}</small></div>
  <div class="sala-p ${tieneT?cT(s.vs_tgt):cY(s.vs_yago)}">${tieneT?fP(s.vs_tgt):fP(s.vs_yago)}</div></div>
  <div class="sala-g"><div>Venta<b>${fM(s.fact_net)}</b></div><div>Target<b>${tieneT?fM(s.tgt_net):'sin target'}</b></div><div>vs Yago<b class="${cY(s.vs_yago)}">${fP(s.vs_yago)}</b></div></div>
  ${tieneT?bar(s.vs_tgt):''}</div>`;
}
function rutaCard(r,i){
  const ss=C.salas.filter(s=>s.ruta===r.ruta).sort((a,b)=>b.vs_tgt-a.vs_tgt);
  const falta=r.tgt_net-r.fact_net;
  return `<div class="card ${kT(r.vs_tgt)}" data-canal="${r.canal}">
  <button class="card-h" onclick="this.parentElement.classList.toggle('open')" aria-expanded="false">
    <div class="card-main"><div class="card-t">${r.ruta} <span class="chip ${r.canal}">${r.canal}</span></div>
    <div class="card-s">${fM(r.fact_net)} de ${fM(r.tgt_net)} · ${falta>0?'faltó '+fM(falta):'sobró '+fM(-falta)} · ${r.n_salas} salas</div></div>
    <div class="card-pct"><b class="${cT(r.vs_tgt)}">${fP(r.vs_tgt)}</b><small>vs Yago ${fP(r.vs_yago)}</small></div><span class="arrow">▼</span></button>
  <div class="card-body">${ss.map(salaRow).join('')}</div></div>`;
}
const rk=C.ranking;
const cd=CP.diario;
function cmpRow(nm,a,b,fmt){return `<tr><td>${nm}</td><td>${fmt(a)}</td><td><b>${fmt(b)}</b></td></tr>`;}
const dz=cd.zona;
const cmpTbl=`<div class="cmp"><table><tr><th></th><th>Diario ${CP.fecha_diario.slice(0,5)}</th><th>Cierre</th></tr>
${cmpRow('Net',dz.fact_net,Z.fact_net,fM)}${cmpRow('vs Target',dz.vs_tgt,Z.vs_tgt,fP)}${cmpRow('vs Yago',dz.vs_yago,Z.vs_yago,fP)}
${cmpRow('WHS vs Target',cd.canal.WHS.vs_tgt,W.vs_tgt,fP)}${cmpRow('SMK vs Target',cd.canal.SMK.vs_tgt,S.vs_tgt,fP)}</table></div>`;
const movR=R.map(r=>({r:r.ruta,a:(cd.rutas[r.ruta]||{}).vs_tgt,b:r.vs_tgt})).map(x=>({...x,d:x.b-x.a})).sort((p,q)=>Math.abs(q.d)-Math.abs(p.d)).slice(0,3);
const cambios=CP.cambios.map(c=>`<div class="chg-i">${esc(c.texto)}</div>`).join('');
const sube=CP.top_suben.map(x=>`${esc(x.sub)} ${x.ruta} <b class="green-txt nw">${fMs(x.delta)}</b>`).join(' · ');
const baja=CP.top_bajan.map(x=>`${esc(x.sub)} ${x.ruta} <b class="red-txt nw">${fMs(x.delta)}</b>`).join(' · ');

document.getElementById('root').innerHTML=`
<section class="hero">
  <div class="hero-top"><div class="big">${fM(Z.fact_net)}</div>
  <span class="state ${estado[1]}">${estado[0]}</span></div>
  <div class="hero-l">vendidos en ${M.periodo.split(' ')[0].toLowerCase()}</div>
  <div class="track"><div class="track-fill" style="width:${Math.min(100,Z.vs_tgt/TMAX*100)}%"></div><div class="track-mark" style="left:calc(${(100/TMAX*100).toFixed(1)}% - 1px)"></div></div>
  <div class="track-legend"><span>${fM(Z.fact_net)} de ${fM(Z.tgt_net)} de target</span><span>DDV <b>${M.ddv_actual}/${M.ddv_total}</b></span></div>
  <div class="need">
    <div>vs Target<b>${fP(Z.vs_tgt)}</b></div>
    <div>vs Yago<b>${fP(Z.vs_yago)}</b></div>
    <div>Diferencia<b>${dif>=0?'+':'−'}${fM(dif)}</b></div>
  </div>
</section>
<div class="grid2">
  <div class="mini"><div class="mini-l" style="color:#6f5a80">Sobre el año pasado</div><div class="mini-v ${difY>=0?'green-txt':'red-txt'}">${fMs(difY)}</div><div class="mini-s">${fM(Z.fact_yago)} en septiembre 2025</div></div>
  <div class="mini"><div class="mini-l" style="color:#6f5a80">Stales</div><div class="mini-v ${cS(Z.stales_pct)}">${fP(Z.stales_pct)}</div><div class="mini-s">${Z.stales_pct<2?'bajo control':'revisar'}</div></div>
</div>

<h2>WHS y SMK</h2>
<div class="grid2" style="margin-top:0">${canalCard('whs','WHS',W)}${canalCard('smk','SMK',S)}</div>

<h2>Cómo quedamos <small>Net Sales</small></h2>
<div class="bench"><div class="bench-t">País y división Centro Costa · vs Target</div>
  ${benchRow('⚛','Chile Total','todo el país',N.chile_total)}
  ${benchRow('🟣','Chile WHS','mayoristas',N.chile_whs)}
  ${benchRow('🟠','Chile SMK','supermercados',N.chile_smk)}
  ${benchRow('🏛','División Centro Costa','los 4 supervisores',D)}
  ${benchRow('📍','Zona San Felipe','Jean',Z,true)}
</div>

<h2>Ranking de la división <small>por % vs target</small></h2>
<div class="bench">
  ${rk.map(x=>`<div class="brow ${x.name.indexOf('Jean')>=0?'me':''}"><div class="brow-n"><span class="pos">${x.pos}</span>${esc(x.name)}<small style="padding-left:22px">${x.sub?esc(x.sub)+' · ':''}${fM(x.fact_net)} de ${fM(x.tgt_net)}</small></div>
  <div class="brow-v ${cT(x.vs_tgt)}" style="${x.name.indexOf('Jean')>=0?'color:#4ade80':''}">${fP(x.vs_tgt)}<small>Yago ${fP(x.vs_yago)}</small></div></div>`).join('')}
</div>

<h2>Rutas <small>toca una para ver sus salas</small></h2>
<div class="seg" id="seg"><button class="on" data-f="TODAS">Todas</button><button data-f="SMK">SMK</button><button data-f="WHS">WHS</button></div>
<div id="rutas">${R.map(rutaCard).join('')}</div>

<h2>Reconocimientos de septiembre</h2>
<div class="rec">
  <div class="rec-c"><div class="l">Mejor avance vs target</div><div class="v">${RC.mejor_avance.ruta}</div><div class="s green-txt">${fP(RC.mejor_avance.vs_tgt)} del objetivo</div></div>
  <div class="rec-c"><div class="l">Mayor crecimiento vs año pasado</div><div class="v">${RC.mayor_crecimiento.ruta}</div><div class="s green-txt">${fP(RC.mayor_crecimiento.vs_yago)} vs Yago</div></div>
  <div class="rec-c rec-wide"><div class="l">Cumplieron el target</div><div class="v">${RC.rutas_sobre_tgt} de ${RC.rutas_total} rutas</div><div class="s">${RC.salas_sobre_tgt} de ${RC.salas_con_tgt} salas con target llegaron al 100% o más</div></div>
</div>

<h2>Qué cambió vs el último diario <small>${CP.fecha_diario}</small></h2>
${cmpTbl}
<div class="chg">${cambios}
  <div class="chg-i"><b>Subieron más:</b> ${sube}</div>
  <div class="chg-i"><b>Bajaron más:</b> ${baja}</div>
</div>
<p class="note">El target del mes no cambió entre el último diario y el cierre. Las diferencias vienen de ajustes de venta, una sala nueva y dos reclasificaciones de canal que trae el archivo oficial. Los semáforos de % vs target usan el avance esperado del mes completo (DDV ${M.ddv_actual}/${M.ddv_total}); el vs Yago es verde desde 100%, ámbar entre 85 y 99% y rojo bajo 85%.</p>
<div class="foot">Fuente: ${esc(M.fuente)} · Evercracks</div>
`;
document.querySelectorAll('#seg button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));
  const f=b.dataset.f; document.querySelectorAll('#rutas .card').forEach(c=>{c.style.display=(f==='TODAS'||c.dataset.canal===f)?'':'none';});
}));
})();
</script>
</body>
</html>
